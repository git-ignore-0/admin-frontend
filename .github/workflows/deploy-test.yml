name: Deploy Admin test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          bash tests/prepare-cpanel-deploy.test.sh
          bash tests/deploy-test-ftps.test.sh
          python3 tests/test_deploy_worker.py
      - name: Build Passenger bundle from commit
        run: pnpm prepare:cpanel
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
      - name: Upload and restart Admin test
        env:
          TEST_FTP_SERVER: ${{ secrets.TEST_FTP_SERVER }}
          TEST_FTP_USERNAME: ${{ secrets.TEST_FTP_USERNAME }}
          TEST_FTP_PASSWORD: ${{ secrets.TEST_FTP_PASSWORD }}
        run: bash scripts/deploy-test-ftps.sh
      - name: Check Admin test login page
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 \
            https://admin-test.naturalfarmingvietnam.com/login \
            --output "$RUNNER_TEMP/admin-test-login.html"
          grep -q '/_next/static/' "$RUNNER_TEMP/admin-test-login.html"
